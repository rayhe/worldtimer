<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>World Timer</title>
  <meta name="description" content="An interactive world-time watch: 24 cities, a sun-tracking 24-hour ring and a live day/night map of the Earth.">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2317191d'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%231e6aa8'/%3E%3Cpath d='M32 32V16M32 32l10 6' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M28 3h8l-4 7z' fill='%231e90ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <div class="wt" id="watch"></div>
    <div class="readout" aria-live="off">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date"></div>
      <div class="zone" id="zone"></div>
      <div class="chips" id="chips"></div>
    </div>
    <p class="hint">Click a city to make it home · drag the 24-hour ring or scroll to travel in time · drag the city ring to turn the Earth<span class="kb"> · type to find a city · <kbd>←</kbd><kbd>→</kbd> zones · <kbd>↑</kbd><kbd>↓</kbd> hours</span></p>
  </main>
  <noscript>This page draws a live clock and needs JavaScript.</noscript>
  <script src="js/core.js"></script>
  <script src="js/land.js"></script>
  <script src="js/watch.js"></script>
  <script src="js/page.js"></script>
  <script>
    var watch = WT.createWatch(document.getElementById('watch'), { home: WT.homeFromHash() });
    WT.page(watch);
    WT.nav('index.html');
  </script>
</body>
</html>
